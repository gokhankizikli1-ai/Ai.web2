# Railway build + deploy configuration — WEB service.
#
# The worker service uses `railway.worker.toml` (no HTTP
# healthcheck — Celery has no port to probe). The worker's
# Config file path is set in the Railway dashboard; see the
# header of `railway.worker.toml` for the one-time setup.
#
# WHY THIS FILE EXISTS
# --------------------
# Railway made Railpack the default builder and put Nixpacks into
# maintenance mode. Railpack installs Python through `mise`, and
# `mise` now REQUIRES GitHub artifact attestations for the binaries
# it fetches. The python-build-standalone assets it wanted predate
# attestations, so every build died with:
#
#   mise ERROR Failed to install core:python@3.11.9
#   No GitHub artifact attestations found for python@3.11.9
#
# Nothing in this repo changed — an upstream verification policy did.
#
# Two earlier attempts failed because they both aimed at Nixpacks:
# `nixpacks.toml` (Railpack never reads it) and `builder = "NIXPACKS"`
# here (no longer reliably honoured now that Nixpacks is deprecated —
# builds fell through to Railpack anyway, which is also why toggling
# the builder in the Railway UI changed nothing).
#
# So we stop trying to steer the buildpack and pin the build outright:
# `Dockerfile` ships Python 3.11 INSIDE the base image, so `mise` is
# never invoked, no version is resolved, and no attestation is checked.
# See the Dockerfile header for why 3.11 specifically (requirements.txt
# has a hard ceiling below 3.13).
#
# WHAT THIS FILE DOES NOT DO
# --------------------------
# * NO start command override — the web service keeps the start
#   command configured on the service in the Railway dashboard.
#   (The Dockerfile carries a matching CMD as a fallback only; note
#   that the Dockerfile builder does NOT read the Procfile — that was
#   a Nixpacks/Railpack feature.)
# * NO restart policy change — keep Railway's defaults.
# * NO dependency change — the image runs the same
#   `pip install -r requirements.txt` the Nixpacks build did.
#
# `nixpacks.toml` is now inert (no builder reads it). It is left in
# place deliberately so this change stays small and trivially
# revertible; removing it is a separate cleanup.

[build]
# Explicit, version-pinned build. Immune to Railpack's Python version
# resolution, to `mise` attestation policy, and to any further default-
# builder migration — the interpreter comes from the base image.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
